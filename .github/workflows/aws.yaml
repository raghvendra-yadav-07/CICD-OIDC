name: creating ec2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::316704942911:role/git_action_role
          aws-region: us-east-1
      - name: install hashicorp 
        uses: hashicorp/setup-terraform@v3
      - name :  terraform init 
        run : |
             echo "making ec2 instance "
             terraform init
      - name: Terraform Plan
        run: terraform plan
      - name: Terraform apply
        run: terraform apply