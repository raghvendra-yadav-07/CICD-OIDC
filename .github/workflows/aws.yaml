name: creating ec2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: install hashicorp 
        uses: hashicorp/setup-terraform@v3
      - name :  terraform init 
        run :
             echo "making ec2 instance "
             terraform init
      - name: Terraform Plan
        run: terraform plan
      - name: Terraform apply
        run: terraform apply