name: AWS OIDC Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4 
      
     
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::316704942911:role/git_action_role
          aws-region: us-east-1

      - name: add file to bucket 
        run : |
            echo "adding file in s3 bucket "
            aws s3 cp ./index.html s3://316704942911/index.html
      
