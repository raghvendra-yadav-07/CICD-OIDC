name: GitHub Push to S3 OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::316704942911:role/github_to_s3
          aws-region: us-east-1

      - name: Upload HTML file
        run: |
          echo "Uploading HTML file to S3..."
          aws s3 cp index.html s3://316704942911/index.html