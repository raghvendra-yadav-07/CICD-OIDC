name : this is a dummy yaml file 

on :
   push :
       branches :
                - main 
jobs :
     deploy-files :
                name : nginx
                runs-on : ubuntu-latest
          
steps : 
      - name : checkout
        uses : action/checkout@v4
      - name : apt update
        run  : 
             echo "apt-update"
             sudo apt update
      - name : downlord nginx 
        run  : 
             echo "downlording nginx"
