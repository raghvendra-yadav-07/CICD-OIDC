<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            display: inline-block;
            padding: 40px;
            border: 2px solid #333;
            border-radius: 12px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🚀 CI/CD Working!</h1>

        <p>GitHub Actions → AWS OIDC → S3</p>

        <p>
            Deployment successful 🎉
        </p>

        <p id="time"></p>
    </div>

    <script>
        document.getElementById("time").innerHTML =
            "Deployed at: " + new Date().toLocaleString();
    </script>

</body>
</html>
